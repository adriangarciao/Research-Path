# Base configuration shared by every profile.
# Database connection settings live in application-local.yml (local dev) or are
# supplied by Testcontainers (tests). No secrets belong in this file.
spring:
  application:
    name: researchpath-backend
  datasource:
    hikari:
      # Fail fast (default is 30s) so /actuator/health reports DOWN promptly when the DB is unavailable.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error bodies

server:
  port: 8080
  error:
    # Never expose internals in error bodies (explicit, although these are Spring's defaults).
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

researchpath:
  openalex:
    base-url: https://api.openalex.org
    # Server-side only. Supplied via the OPENALEX_API_KEY environment variable; may be empty.
    api-key: ${OPENALEX_API_KEY:}
    connect-timeout: 5s
    # Bounds one attempt including the body (M7: 16 live pages took 0.5-1.2 s, so 10 s is ~8x the slowest).
    read-timeout: 10s
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 30s
    max-per-page: 100
    max-response-size: 8MB   # ~4-5x a full 100-work page; larger bodies are rejected unparsed
    # All provider calls of one generation (pages and retries) share this budget (release decision R5). An attempt
    # or retry wait starts only if it fits, so the provider phase never exceeds it; then 503 "try again".
    generation-budget: 30s
  ingestion:
    # PROVISIONAL (blueprint D11): 100-300 candidates is a planning target, not a tested value.
    default-candidates: 100
    max-candidates: 200
    max-topic-length: 300
  paths:
    # PROVISIONAL (S02): local bounds; rate limits and anonymous quotas come with M13.
    max-concurrent-generations: 4
    max-revisions-per-path: 50
  retention:
    # PROVISIONAL (S02): anonymous paths not opened for path-days are deleted; snapshots no path uses after snapshot-days.
    enabled: true
    path-days: 90
    snapshot-days: 30
    cron: "0 17 3 * * *"
  cors:
    # Exact browser origins allowed to call /api/paths cross-origin. Empty = same-origin only (default).
    allowed-origins: []
  client-ip:
    # Empty = rate-limit by TCP connection address and ignore client-supplied headers (default).
    trusted-header: ""
  provider-budget:
    # Durable daily cap on OpenAlex calls (retries included), per UTC day like the provider's allowance
    # (free key: $1/day = 1000 searches). Counted in PostgreSQL (V8): survives restarts and redeploys.
    enabled: true
    daily-calls: 900
  rate-limit:
    # PROVISIONAL (S02): per connection; a new path costs provider requests, a rebuild only local work.
    enabled: true
    create-burst: 3
    creates-per-hour: 10
    regenerate-burst: 10
    regenerations-per-hour: 120
    max-clients: 10000
  dev-api:
    enabled: false   # /api/dev/** endpoints; enabled in the local profile only
